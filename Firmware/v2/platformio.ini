; PlatformIO Project Configuration File
;
; Firmware v2：OLED 屏幕 + 旋转编码器 本地控制固件（无 Web、无 WiFi）。
; 屏幕驱动基于 KK_OLED，界面基于 KK_UI（均以可编辑源码形式放在 src/ 下）。
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags =
    -Isrc/kk_oled
    -Isrc/kk_ui
    ; ESP8266 的 Wire 外设没有 IT/DMA 传输能力，KK_UI 使用阻塞刷新。
    -DKK_UI_REFRESH_MODE=KK_UI_REFRESH_BLOCKING
monitor_speed = 2400
