; PlatformIO Project Configuration File
;
; Firmware v2：OLED 屏幕 + 旋转编码器 本地控制固件（无 Web、无 WiFi）。
; 屏幕驱动基于 KK_OLED，界面基于 KK_UI（均以可编辑源码形式放在 src/ 下）。
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags =
    -Isrc/kk_oled
    -Isrc/kk_ui
    ; ESP8266 的 Wire 外设没有 IT/DMA 传输能力，KK_UI 使用阻塞刷新。
    -DKK_UI_REFRESH_MODE=KK_UI_REFRESH_BLOCKING
monitor_speed = 2400

[env:nodemcuv2]
; 默认固件

[env:diag]
; OLED 诊断固件：USB 串口 115200，扫描 I2C 并直测屏幕，用于排查不显示问题
build_flags =
    ${env.build_flags}
    -DOLED_DIAGNOSTIC
monitor_speed = 115200
